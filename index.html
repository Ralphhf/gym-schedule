<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#07070b">
<title>My Weekly Split</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Split">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#07070b; --bg2:#0e0e15; --card:#11111a; --card2:#171722;
    --line:#23232f; --line2:#2c2c3a;
    --txt:#f4f4f7; --muted:#8e8e9e; --muted2:#5c5c6e;
    --heavy:#ff5d6c; --moderate:#4d9fff; --run:#b07bff; --rest:#4a4a5a;
    --accent:#4ade80; --accent2:#34d399;
    --radius:18px; --radius-sm:11px;
    --font-display:"Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    --font-mono:"JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
    font-size:16px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0;}
  body{
    background:
      radial-gradient(900px 500px at 85% -10%, rgba(74,222,128,.06), transparent 60%),
      radial-gradient(700px 400px at 15% 30%, rgba(176,123,255,.04), transparent 70%),
      var(--bg);
    color:var(--txt);
    font-family:var(--font-display);
    font-feature-settings:"cv11","ss01","ss03";
    min-height:100vh;
    padding:env(safe-area-inset-top) 16px calc(48px + env(safe-area-inset-bottom));
    max-width:720px; margin:0 auto;
    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
  }

  /* ---- header ---- */
  header{padding:28px 4px 18px; display:flex; align-items:flex-end; justify-content:space-between; gap:12px;}
  header .title{flex:1;}
  h1{font-size:1.65rem; margin:0; letter-spacing:-.035em; font-weight:900; line-height:1;}
  h1 .accent{color:var(--accent); font-weight:900;}
  .sub{color:var(--muted); font-size:.82rem; margin-top:6px; letter-spacing:.01em;}
  .week-dots{display:flex; gap:5px; align-items:center; padding-bottom:4px;}
  .week-dots .wd{width:7px; height:7px; border-radius:50%; background:var(--line2); transition:all .25s ease;}
  .week-dots .wd.done{background:var(--muted2);}
  .week-dots .wd.today{background:var(--accent); width:22px; border-radius:4px; box-shadow:0 0 12px rgba(74,222,128,.5);}

  /* ---- day grid ---- */
  .grid{display:grid; grid-template-columns:repeat(2,1fr); gap:12px; margin-top:6px;}
  .grid .full{grid-column:1 / -1;}
  .day{
    position:relative; border:1px solid var(--line); border-radius:var(--radius);
    background:
      radial-gradient(140% 100% at 0% 0%, color-mix(in srgb, var(--bar) 9%, transparent), transparent 55%),
      linear-gradient(180deg, var(--card2), var(--card));
    padding:16px 14px 14px 18px; cursor:pointer; overflow:hidden;
    transition:transform .12s ease, border-color .2s ease, box-shadow .2s ease;
    min-height:115px; display:flex; flex-direction:column; justify-content:space-between;
  }
  .day:hover{border-color:var(--line2);}
  .day:active{transform:scale(.985);}
  .day.open{border-color:var(--bar); box-shadow:0 0 0 1px color-mix(in srgb, var(--bar) 35%, transparent), 0 8px 28px -12px color-mix(in srgb, var(--bar) 40%, transparent);}
  .day.today{border-color:color-mix(in srgb, var(--accent) 45%, var(--line));}
  .day.today::after{content:"TODAY"; position:absolute; top:9px; right:10px; font-family:var(--font-mono); font-size:.55rem; font-weight:700; letter-spacing:.14em; color:var(--accent); background:rgba(74,222,128,.12); padding:3px 6px; border-radius:5px; border:1px solid rgba(74,222,128,.35);}
  .day::before{content:""; position:absolute; left:0; top:0; bottom:0; width:4px; background:var(--bar);}
  .day .dow{font-family:var(--font-mono); font-size:.66rem; letter-spacing:.18em; text-transform:uppercase; color:var(--muted2); font-weight:500;}
  .day .focus{font-size:1.4rem; font-weight:800; margin-top:6px; letter-spacing:-.025em; line-height:1.05;}
  .day .meta{display:flex; align-items:center; gap:6px; margin-top:12px; flex-wrap:wrap;}
  .chip{
    font-family:var(--font-mono); font-size:.62rem; font-weight:500; letter-spacing:.12em; text-transform:uppercase;
    padding:4px 8px 3px; border-radius:5px; border:1px solid transparent;
    display:inline-flex; align-items:center; gap:5px;
  }
  .chip::before{content:""; width:5px; height:5px; border-radius:50%; background:currentColor;}
  .chip.heavy{color:var(--heavy); background:rgba(255,93,108,.1); border-color:rgba(255,93,108,.28);}
  .chip.moderate{color:var(--moderate); background:rgba(77,159,255,.1); border-color:rgba(77,159,255,.28);}
  .chip.intervals{color:var(--run); background:rgba(176,123,255,.1); border-color:rgba(176,123,255,.28);}
  .chip.rest{color:var(--muted); background:rgba(120,120,140,.08); border-color:rgba(120,120,140,.22);}
  .day .caret{position:absolute; right:13px; bottom:11px; color:var(--muted2); font-size:.72rem; transition:transform .25s ease;}
  .day.open .caret{transform:rotate(180deg); color:var(--bar);}

  /* ---- detail panel ---- */
  .detail{grid-column:1 / -1; display:none;}
  .detail.show{display:block; animation:fade .28s cubic-bezier(.2,.7,.3,1);}
  @keyframes fade{from{opacity:0; transform:translateY(-8px);} to{opacity:1; transform:none;}}
  .panel{
    border:1px solid var(--line); border-top:3px solid var(--bar);
    border-radius:var(--radius); background:var(--card); padding:18px 16px 8px; margin-top:-4px;
  }
  .scheme{
    display:grid; grid-template-columns:repeat(3,1fr); gap:9px; margin-bottom:20px;
  }
  .scheme .box{
    background:var(--bg2); border:1px solid var(--line);
    border-radius:13px; padding:12px 13px;
  }
  .scheme .box .k{font-family:var(--font-mono); font-size:.58rem; text-transform:uppercase; letter-spacing:.14em; color:var(--muted2); font-weight:500;}
  .scheme .box .v{font-size:1.05rem; font-weight:800; margin-top:5px; letter-spacing:-.02em;}
  .scheme .box .v small{font-weight:500; color:var(--muted); font-size:.74rem; letter-spacing:0;}

  .muscle{margin-bottom:18px;}
  .muscle h3{
    font-family:var(--font-mono); font-size:.7rem; margin:0 0 9px; color:var(--muted); font-weight:500;
    display:flex; align-items:center; gap:9px; text-transform:uppercase; letter-spacing:.1em;
  }
  .muscle h3 .dot{width:6px; height:6px; border-radius:50%; background:var(--bar); flex:none; box-shadow:0 0 8px var(--bar);}
  .ex{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    background:var(--bg2); border:1px solid var(--line); border-radius:13px;
    padding:12px 13px; margin-bottom:8px; text-decoration:none; color:var(--txt);
    transition:border-color .18s ease, background .18s ease, transform .12s ease;
  }
  .ex:hover{border-color:color-mix(in srgb, var(--bar) 40%, var(--line)); background:var(--card2);}
  .ex:active{transform:scale(.99);}
  .ex .name{font-size:.94rem; font-weight:600; line-height:1.3; letter-spacing:-.01em;}
  .ex .src{font-family:var(--font-mono); font-size:.64rem; color:var(--muted2); margin-top:3px; letter-spacing:.02em;}
  .ex .play{
    flex:none; width:36px; height:36px; border-radius:10px;
    background:color-mix(in srgb, var(--bar) 13%, transparent); display:grid; place-items:center;
    border:1px solid color-mix(in srgb, var(--bar) 28%, transparent);
    transition:background .18s ease, transform .18s ease;
  }
  .ex:hover .play{background:color-mix(in srgb, var(--bar) 22%, transparent); transform:scale(1.06);}
  .ex .play svg{width:14px; height:14px; fill:var(--bar);}

  /* running card */
  .run-block{margin-bottom:16px;}
  .run-block .k{font-family:var(--font-mono); font-size:.62rem; text-transform:uppercase; letter-spacing:.14em; color:var(--run); font-weight:500; margin-bottom:8px;}
  .run-block .opt{
    background:var(--bg2); border:1px solid var(--line); border-radius:13px;
    padding:13px 14px; margin-bottom:8px; font-size:.94rem; font-weight:600; letter-spacing:-.01em;
  }
  .run-block .opt small{display:block; color:var(--muted); font-weight:500; font-size:.8rem; margin-top:4px; line-height:1.45; letter-spacing:0;}

  /* stats / TDEE card */
  .stats{
    border:1px solid var(--line); border-radius:var(--radius);
    background:
      radial-gradient(120% 140% at 100% 0%, rgba(74,222,128,.1), transparent 50%),
      linear-gradient(180deg, var(--card2), var(--card));
    padding:16px 18px 15px; margin:0 0 18px; cursor:pointer;
    position:relative; overflow:hidden;
    transition:transform .12s ease, border-color .2s ease, box-shadow .2s ease;
  }
  .stats:active{transform:scale(.99);}
  .stats.open{border-color:color-mix(in srgb, var(--accent) 45%, var(--line)); box-shadow:0 8px 30px -14px rgba(74,222,128,.5);}
  .stats::before{content:""; position:absolute; left:0; top:0; bottom:0; width:4px; background:linear-gradient(180deg, var(--accent), var(--accent2));}
  .stats-row{display:flex; justify-content:space-between; align-items:center; gap:14px;}
  .stats .col-k{font-family:var(--font-mono); font-size:.6rem; letter-spacing:.16em; text-transform:uppercase; color:var(--muted2); font-weight:500;}
  .stats .profile-v{font-size:1.05rem; font-weight:800; margin-top:5px; letter-spacing:-.025em;}
  .stats .profile-sub{font-family:var(--font-mono); font-size:.7rem; color:var(--muted); margin-top:3px; letter-spacing:.02em;}
  .stats .kcal{text-align:right;}
  .stats .kcal-big{font-size:2rem; font-weight:900; letter-spacing:-.04em; color:var(--accent); line-height:.95; white-space:nowrap;}
  .stats .kcal-big .u{font-family:var(--font-mono); font-size:.58rem; font-weight:500; color:var(--muted); letter-spacing:.1em; margin-left:4px; text-transform:uppercase;}
  .stats .kcal-sub{font-family:var(--font-mono); font-size:.62rem; color:var(--muted2); margin-top:6px; letter-spacing:.04em;}
  .stats .caret{position:absolute; right:14px; bottom:11px; color:var(--muted2); font-size:.72rem; transition:transform .25s ease;}
  .stats.open .caret{transform:rotate(180deg); color:var(--accent);}
  .stats-detail{display:none; margin-top:16px; padding-top:16px; border-top:1px solid var(--line);}
  .stats.open .stats-detail{display:block; animation:fade .26s ease;}
  .stats-tri{display:grid; grid-template-columns:1fr 1fr 1fr; gap:9px; margin-bottom:16px;}
  .stats-tri .box{background:var(--bg2); border:1px solid var(--line); border-radius:12px; padding:11px 11px;}
  .stats-tri .box .k{font-family:var(--font-mono); font-size:.56rem; color:var(--muted2); font-weight:500; letter-spacing:.12em; text-transform:uppercase;}
  .stats-tri .box .v{font-size:1rem; font-weight:800; margin-top:4px; letter-spacing:-.02em;}
  .stats-tri .box .v small{font-weight:500; color:var(--muted); font-size:.66rem; font-family:var(--font-mono);}
  .day-burn{display:flex; justify-content:space-between; align-items:center; padding:9px 12px; border-radius:10px; background:var(--bg2); border:1px solid var(--line); margin-bottom:6px; font-size:.85rem;}
  .day-burn .lbl{display:flex; align-items:center; gap:9px; min-width:0;}
  .day-burn .dot2{width:7px; height:7px; border-radius:50%; flex:none; box-shadow:0 0 7px currentColor;}
  .day-burn .focus2{font-weight:700; font-family:var(--font-mono); font-size:.74rem; letter-spacing:.04em;}
  .day-burn .note{color:var(--muted2); font-size:.74rem; margin-left:7px;}
  .day-burn .val{color:var(--accent); font-weight:800; font-size:.92rem; font-variant-numeric:tabular-nums; white-space:nowrap;}
  .day-burn .val .b{color:var(--muted2); font-weight:500; font-size:.68rem; font-family:var(--font-mono);}
  .stats-foot{margin-top:12px; padding:12px 14px; background:rgba(74,222,128,.06); border:1px solid rgba(74,222,128,.22); border-radius:12px; font-size:.8rem; color:var(--txt); line-height:1.55;}
  .stats-foot b{color:var(--accent); font-weight:700;}

  /* ---- goal + macros card ---- */
  .goal{
    border:1px solid var(--line); border-radius:var(--radius);
    background:
      radial-gradient(120% 140% at 0% 0%, rgba(176,123,255,.1), transparent 50%),
      linear-gradient(180deg, var(--card2), var(--card));
    padding:16px 18px 18px; margin:0 0 18px; position:relative; overflow:hidden;
  }
  .goal::before{content:""; position:absolute; left:0; top:0; bottom:0; width:4px; background:linear-gradient(180deg, var(--run), #8b5cf6);}
  .goal .col-k{font-family:var(--font-mono); font-size:.6rem; letter-spacing:.16em; text-transform:uppercase; color:var(--muted2); font-weight:500;}
  .goal .goal-title{font-size:1.15rem; font-weight:900; margin-top:5px; letter-spacing:-.03em; line-height:1.1;}
  .goal .goal-sub{font-size:.8rem; color:var(--muted); margin-top:6px; line-height:1.5;}
  .goal .goal-cal{display:flex; align-items:baseline; gap:7px; margin-top:14px; padding-top:14px; border-top:1px solid var(--line);}
  .goal .goal-cal .num{font-size:1.7rem; font-weight:900; letter-spacing:-.04em; color:var(--run); font-variant-numeric:tabular-nums;}
  .goal .goal-cal .lab{font-family:var(--font-mono); font-size:.62rem; letter-spacing:.1em; text-transform:uppercase; color:var(--muted);}
  /* macro bars */
  .macros{margin-top:14px; display:flex; flex-direction:column; gap:11px;}
  .macro .mhead{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:5px;}
  .macro .mname{font-weight:800; font-size:.92rem; letter-spacing:-.01em;}
  .macro .mname .pct{font-family:var(--font-mono); font-size:.62rem; color:var(--muted2); font-weight:500; margin-left:7px; letter-spacing:.05em;}
  .macro .mval{font-family:var(--font-mono); font-weight:700; font-size:.9rem; font-variant-numeric:tabular-nums;}
  .macro .mval .kc{color:var(--muted2); font-size:.68rem; font-weight:500; margin-left:6px;}
  .macro .bar{height:8px; border-radius:99px; background:var(--bg2); overflow:hidden; border:1px solid var(--line);}
  .macro .bar i{display:block; height:100%; border-radius:99px;}
  .macro.p .mval, .macro.p .mname{color:#ff8da3;}  .macro.p .bar i{background:linear-gradient(90deg,#ff5d6c,#ff8da3);}
  .macro.f .mval, .macro.f .mname{color:#ffc861;}  .macro.f .bar i{background:linear-gradient(90deg,#f5a623,#ffc861);}
  .macro.c .mval, .macro.c .mname{color:#5fb6ff;}  .macro.c .bar i{background:linear-gradient(90deg,#4d9fff,#7ec4ff);}
  .goal-tip{margin-top:15px; padding:11px 13px; background:rgba(176,123,255,.07); border:1px solid rgba(176,123,255,.25); border-radius:12px; font-size:.78rem; color:var(--txt); line-height:1.55;}
  .goal-tip b{color:var(--run); font-weight:700;}

  /* ---- meal plan (Fuel) ---- */
  .fuel-head{display:flex; align-items:center; justify-content:space-between; margin:4px 4px 12px;}
  .fuel-head h2{font-size:1.15rem; font-weight:900; letter-spacing:-.03em; margin:0;}
  .fuel-head .h-sub{font-family:var(--font-mono); font-size:.62rem; color:var(--muted2); letter-spacing:.08em; text-transform:uppercase;}
  .meal{
    border:1px solid var(--line); border-radius:var(--radius); background:var(--card);
    margin-bottom:11px; overflow:hidden; transition:border-color .2s ease;
  }
  .meal.open{border-color:var(--accent);}
  .meal-bar{display:flex; align-items:center; justify-content:space-between; gap:12px; padding:15px 16px; cursor:pointer;}
  .meal-bar:active{background:var(--card2);}
  .meal-bar .mt{display:flex; align-items:center; gap:11px;}
  .meal-bar .emoji{font-size:1.25rem;}
  .meal-bar .mtitle{font-size:1.02rem; font-weight:800; letter-spacing:-.01em;}
  .meal-bar .mtarget{font-family:var(--font-mono); font-size:.6rem; color:var(--muted2); letter-spacing:.04em; margin-top:2px;}
  .meal-bar .mcaret{color:var(--muted2); font-size:.72rem; transition:transform .25s ease;}
  .meal.open .meal-bar .mcaret{transform:rotate(180deg); color:var(--accent);}
  .meal-body{display:none; padding:0 13px 13px;}
  .meal.open .meal-body{display:block; animation:fade .24s ease;}
  .opt-card{background:var(--bg2); border:1px solid var(--line); border-radius:13px; padding:13px 14px; margin-bottom:9px;}
  .opt-card:last-child{margin-bottom:2px;}
  .opt-head{display:flex; align-items:baseline; justify-content:space-between; gap:10px; margin-bottom:8px;}
  .opt-name{font-weight:800; font-size:.95rem; letter-spacing:-.01em;}
  .opt-name .ona{font-family:var(--font-mono); font-size:.6rem; color:var(--accent); font-weight:700; margin-right:7px;}
  .opt-kcal{font-family:var(--font-mono); font-size:.74rem; font-weight:700; color:var(--muted); white-space:nowrap; font-variant-numeric:tabular-nums;}
  .opt-items{list-style:none; margin:0 0 10px; padding:0;}
  .opt-items li{font-size:.85rem; color:var(--txt); padding:3px 0 3px 16px; position:relative; line-height:1.4;}
  .opt-items li::before{content:""; position:absolute; left:2px; top:10px; width:4px; height:4px; border-radius:50%; background:var(--muted2);}
  .opt-items li .amt{color:var(--muted); font-family:var(--font-mono); font-size:.78rem;}
  .mmac{display:flex; gap:6px; flex-wrap:wrap;}
  .mmac .pill{font-family:var(--font-mono); font-size:.64rem; font-weight:700; padding:3px 8px; border-radius:6px; letter-spacing:.02em;}
  .mmac .pill.p{color:#ff8da3; background:rgba(255,93,108,.12);}
  .mmac .pill.c{color:#5fb6ff; background:rgba(77,159,255,.12);}
  .mmac .pill.f{color:#ffc861; background:rgba(245,166,35,.12);}
  .fuel-foot{margin:4px 2px 0; padding:13px 15px; background:rgba(74,222,128,.06); border:1px solid rgba(74,222,128,.22); border-radius:13px; font-size:.8rem; line-height:1.55; color:var(--txt);}
  .fuel-foot b{color:var(--accent); font-weight:700;}

  /* ---- meal selection + cart ---- */
  .opt-card{position:relative;}
  .opt-card.sel{border-color:var(--accent); background:rgba(74,222,128,.06);}
  .opt-add{
    margin-top:10px; width:100%; border:1px solid var(--line2); background:var(--bg);
    color:var(--txt); font-family:var(--font-mono); font-size:.7rem; font-weight:700;
    letter-spacing:.08em; text-transform:uppercase; padding:8px; border-radius:9px;
    cursor:pointer; transition:all .15s ease; display:flex; align-items:center; justify-content:center; gap:7px;
  }
  .opt-add:active{transform:scale(.98);}
  .opt-card.sel .opt-add{background:var(--accent); color:#06210f; border-color:var(--accent);}
  .opt-add .ic{font-size:.85rem; line-height:1;}

  /* days stepper inside fuel head */
  .days-pick{display:flex; align-items:center; gap:0; border:1px solid var(--line2); border-radius:9px; overflow:hidden;}
  .days-pick button{background:var(--bg2); color:var(--txt); border:none; width:30px; height:30px; font-size:1.1rem; font-weight:800; cursor:pointer; line-height:1;}
  .days-pick button:active{background:var(--card2);}
  .days-pick .dval{font-family:var(--font-mono); font-size:.78rem; font-weight:700; padding:0 11px; min-width:64px; text-align:center;}
  .days-pick .dval small{color:var(--muted2); font-weight:500;}

  /* floating cart tray */
  .tray{
    position:fixed; left:50%; transform:translateX(-50%) translateY(140%);
    bottom:calc(16px + env(safe-area-inset-bottom)); width:calc(100% - 32px); max-width:688px;
    background:linear-gradient(180deg, #16261c, #0f1a13);
    border:1px solid rgba(74,222,128,.4); border-radius:16px;
    box-shadow:0 16px 50px -12px rgba(0,0,0,.7), 0 0 0 1px rgba(74,222,128,.15);
    padding:13px 15px; display:flex; align-items:center; justify-content:space-between; gap:12px;
    z-index:50; transition:transform .35s cubic-bezier(.2,.8,.2,1);
  }
  .tray.show{transform:translateX(-50%) translateY(0);}
  .tray .t-info{min-width:0;}
  .tray .t-count{font-weight:800; font-size:.95rem; letter-spacing:-.01em;}
  .tray .t-count b{color:var(--accent);}
  .tray .t-sub{font-family:var(--font-mono); font-size:.62rem; color:var(--muted); letter-spacing:.04em; margin-top:2px;}
  .tray .t-btn{
    flex:none; background:var(--accent); color:#06210f; border:none; font-weight:800;
    font-size:.88rem; padding:11px 16px; border-radius:11px; cursor:pointer; letter-spacing:-.01em;
    display:flex; align-items:center; gap:7px; transition:transform .12s ease, opacity .2s ease;
  }
  .tray .t-btn:active{transform:scale(.97);}
  .tray .t-btn:disabled{opacity:.6; cursor:wait;}
  .tray .t-clear{background:none; border:none; color:var(--muted2); font-size:1.1rem; cursor:pointer; padding:4px; flex:none;}

  /* cart result modal */

  .cart-actions .close{background:var(--bg2); color:var(--txt); border:1px solid var(--line2);}

  .track .t-date{font-family:var(--font-mono); font-size:.66rem; color:var(--muted); margin-top:2px;}

  .chk{flex:1; border:1px solid var(--line2); background:var(--bg2); border-radius:12px; padding:11px 10px; cursor:pointer; text-align:center; transition:all .15s ease;}

    }
    out += `<div class="run-block"><div class="k">Warm-up</div><div class="opt">${d.running.warmup}</div></div>`;
    out += `<div class="run-block"><div class="k">Main — progress through phases</div>`;
    d.running.main.forEach(m => out += `<div class="opt">${m[0]}<small>${m[1]}</small></div>`);
    out += `</div>`;
    out += `<div class="run-block"><div class="k">Cool-down</div><div class="opt">${d.running.cooldown}</div></div>`;
    return out;
  }
  const s = SCHEMES[d.intensity];
  let out = `<div class="scheme">
      <div class="box"><div class="k">Intensity</div><div class="v" style="color:${d.color}">${d.intensity}</div></div>
      <div class="box"><div class="k">Volume</div><div class="v">${s.sets} <small>× ${s.reps}</small></div></div>
      <div class="box"><div class="k">Rest</div><div class="v">${s.rest}</div></div>
    </div>`;
  d.groups.forEach(g => {
    if(g[1] === null){
      out += `<div class="section-note">${g[0]}<small>${g[2]||""}</small></div>`;
      return;
    }
    out += `<div class="muscle"><h3><span class="dot"></span>${g[0]}</h3>`;
    g[1].forEach(name => {
      const v = linkFor(name);
      out += `<a class="ex" href="${v.u}" target="_blank" rel="noopener">

                <span class="play">${PLAY}</span>
              </a>`;
    });
    out += `</div>`;
  });
  return out;
}

/* ============================================================
   STORAGE HELPERS + DATE UTILS (localStorage persistence)
   ============================================================ */
const LS = {
  get(k, d){ try{ return JSON.parse(localStorage.getItem(k)) ?? d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
function todayKey(){ return new Date().toISOString().slice(0,10); } // YYYY-MM-DD
function isoWeek(d=new Date()){
  const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const day = t.getUTCDay() || 7; t.setUTCDate(t.getUTCDate()+4-day);
  const ys = new Date(Date.UTC(t.getUTCFullYear(),0,1));
  const wk = Math.ceil((((t-ys)/86400000)+1)/7);
  return `${t.getUTCFullYear()}-W${String(wk).padStart(2,'0')}`;
}
function fmt(n){ return Math.round(n).toLocaleString(); }

  const streak = (field)=>{
    let s=0; const d=new Date();
    for(let i=0;i<60;i++){ const k=d.toISOString().slice(0,10); const e=daily[k]; if(e&&e[field]){s++; d.setDate(d.getDate()-1);} else break; }
    return s;
  };

  // consumed macros from checked meals
  let cp=0,cc=0,cf=0,ck=0;
  today.meals.forEach(key=>{ const o=optByKey(key); if(o){cp+=o.p;cc+=o.c;cf+=o.f;ck+=o.kcal;} });
  const bar=(cls,name,val,tgt)=>{ const pct=Math.min(100,Math.round(val/tgt*100)); return `<div class="mp ${cls}"><div class="mp-row"><span class="mp-n">${name}</span><span class="mp-v">${fmt(val)} / ${fmt(tgt)}${cls==='k'?'':'g'} · ${pct}%</span></div><div class="mp-bar"><i style="width:${pct}%"></i></div></div>`; };

  // meal checklist rows
  const mealRows = MEALS.map(m=>m.options.map(o=>{
    const key=`${m.meal}|${o.n}`; const on=today.meals.includes(key);
    return `<div class="meal-chk ${on?'on':''}" data-mealkey="${key}"><span class="box">${on?'✓':''}</span><span class="mc-name">${m.emoji} ${m.meal} <small>${o.name}</small></span><span class="mc-mac">${o.p}P·${o.c}C·${o.f}F</span></div>`;
  }).join("")).join("");

  // weekly budget
  const wkTotal = Object.values(calWeek).reduce((a,b)=>a+b,0);
  const loggedDays = Object.keys(calWeek).length;
  const pct = Math.min(100, Math.round(wkTotal/WEEK_BUDGET*100));
  const over = wkTotal > WEEK_BUDGET;
  const remaining = WEEK_BUDGET - wkTotal;
  const dowShort=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
  // map ISO week days
  const weekDates=[]; { const d=new Date(); const day=(d.getDay()||7); d.setDate(d.getDate()-(day-1)); for(let i=0;i<7;i++){ weekDates.push(d.toISOString().slice(0,10)); d.setDate(d.getDate()+1);} }
  const dayCells = weekDates.map((dk,i)=>{ const v=calWeek[dk]; const isToday=dk===tk; return `<div class="wkd ${v?'logged':''} ${isToday?'today2':''}">${dowShort[i]}<b>${v?fmt(v):'–'}</b></div>`; }).join("");

  el.innerHTML = `
    <div class="col-k">Today</div>
    <h2>📋 Daily Tracker</h2>
    <div class="t-date">${new Date().toLocaleDateString(undefined,{weekday:'long',month:'short',day:'numeric'})}</div>

    <div class="chk-row">
      <div class="chk ${today.creatine?'on':''}" data-chk="creatine">
        <div class="cticon">💊</div><div class="ctlbl">Creatine</div>
        <div class="ctstreak">${streak('creatine')||0}d streak</div>
      </div>
      <div class="chk ${today.protein?'on':''}" data-chk="protein">
        <div class="cticon">🥩</div><div class="ctlbl">185g Protein</div>
        <div class="ctstreak">${streak('protein')||0}d streak</div>
      </div>
    </div>

    <div class="sub-h">Today's macros (from meals checked below)</div>
    ${bar('p','Protein',cp,GOAL.protein_g)}
    ${bar('c','Carbs',cc,GOAL.carbs_g)}
    ${bar('f','Fat',cf,GOAL.fat_g)}
    ${bar('k','Calories',ck,GOAL.calories)}

    <div class="sub-h">Meals eaten today</div>
    ${mealRows}

    <div class="wk-budget">
      <div class="wk-top">
        <span class="wk-t">📅 Weekly calorie budget</span>
        <span class="wk-state ${over?'over':'under'}">${over?'+'+fmt(wkTotal-WEEK_BUDGET)+' over':fmt(remaining)+' left'}</span>
      </div>
      <div class="wk-bar"><i class="${over?'over':''}" style="width:${pct}%"></i></div>
      <div class="wk-foot"><span>${fmt(wkTotal)} eaten</span><span>budget ${fmt(WEEK_BUDGET)} (${loggedDays}/7 logged)</span></div>
      <div class="wk-days">${dayCells}</div>
      <div class="wk-log">
        <input id="calInput" type="number" inputmode="numeric" placeholder="Today's calories…">
        <button id="calSave">Log today</button>
      </div>
    </div>`;

  // wire daily checks
  el.querySelectorAll('.chk').forEach(c=>c.addEventListener('click',()=>{
    const f=c.dataset.chk; const dd=LS.get('gs_daily',{}); const t=dd[tk]||{creatine:false,protein:false,meals:[]};
    t[f]=!t[f]; dd[tk]=t; LS.set('gs_daily',dd); renderTracker();
  }));
  // wire meal checklist
  el.querySelectorAll('.meal-chk').forEach(c=>c.addEventListener('click',()=>{
    const key=c.dataset.mealkey; const dd=LS.get('gs_daily',{}); const t=dd[tk]||{creatine:false,protein:false,meals:[]};
    const i=t.meals.indexOf(key); if(i>=0)t.meals.splice(i,1); else t.meals.push(key);
    dd[tk]=t; LS.set('gs_daily',dd); renderTracker();
  }));
  // wire calorie log
  const calBtn=el.querySelector('#calSave'); const calIn=el.querySelector('#calInput');
  if(calBtn) calBtn.addEventListener('click',()=>{
    const v=parseInt(calIn.value,10); if(!v||v<0) return;
    const ca=LS.get('gs_cal',{}); if(!ca[wk])ca[wk]={}; ca[wk][tk]=v; LS.set('gs_cal',ca); renderTracker();
  });
  if(calIn) calIn.addEventListener('keydown',e=>{ if(e.key==='Enter')calBtn.click(); });
}
renderTracker();

/* ============================================================
   CART: selection state + quantity engine + Walmart cart handoff
   ============================================================ */
const SELECTED = new Set();
let MEAL_DAYS = 3;

function optByKey(key){
  const [meal,n] = key.split("|");
  const m = MEALS.find(x=>x.meal===meal);
  return m ? m.options.find(o=>o.n===n) : null;
}
function toggleSelect(key){
  if(SELECTED.has(key)) SELECTED.delete(key); else SELECTED.add(key);
  document.querySelectorAll(`.opt-card[data-key="${key}"]`).forEach(c=>{
    const on = SELECTED.has(key);
    c.classList.toggle('sel', on);
    const lbl = c.querySelector('.opt-add .lbl');
    const ic = c.querySelector('.opt-add .ic');
    if(lbl) lbl.textContent = on ? "Added" : "Add to cart";
    if(ic) ic.textContent = on ? "✓" : "+";
  });
  updateTray();
}
function updateTray(){
  const tray = document.getElementById('tray');
  const n = SELECTED.size;
  document.getElementById('trayCount').textContent = n;
  document.getElementById('traySub').textContent = `for ${MEAL_DAYS} day${MEAL_DAYS>1?'s':''} · tap Build Cart`;
  tray.classList.toggle('show', n>0);
}
// aggregate selected options × days → merged products → packages to buy
function buildList(){
  const merged = {}; // name -> total qty in BUY unit
  SELECTED.forEach(key=>{
    (BUY[key]||[]).forEach(it=>{
      if(!merged[it.name]) merged[it.name] = { name:it.name, unit:it.unit, qty:0 };
      merged[it.name].qty += it.qty * MEAL_DAYS;
    });
  });
  return Object.values(merged).map(it=>{
    const prod = PRODUCTS[it.name] || { id:null, pack:1, label:"" };
    const packages = Math.max(1, Math.ceil(it.qty / prod.pack));
    return {
      name: it.name,
      packages,                 // how many to add to cart
      label: prod.label,        // package description
      id: prod.id               // Walmart item id (null = no auto-add)
    };
  });
}
// build the Walmart add-to-cart URL: items=ID|QTY,ID|QTY
function walmartCartURL(list){
  const parts = list.filter(it=>it.id).map(it=>`${it.id}|${it.packages}`);
  return "https://affil.walmart.com/cart/addToCart?items=" + parts.join(",");
}

/* days stepper */
(function wireDays(){
  const valEl = document.getElementById('dVal');
  const set = (d)=>{ MEAL_DAYS = Math.max(1, Math.min(7, d)); valEl.textContent = MEAL_DAYS; updateTray(); };
  document.getElementById('dMinus').addEventListener('click', ()=>set(MEAL_DAYS-1));
  document.getElementById('dPlus').addEventListener('click', ()=>set(MEAL_DAYS+1));
})();

/* tray actions */
document.getElementById('trayClear').addEventListener('click', ()=>{
  [...SELECTED].forEach(k=>toggleSelect(k));
});
document.getElementById('trayBuild').addEventListener('click', openCartModal);

function openCartModal(){
  const list = buildList();
  if(list.length===0) return;
  const box = document.getElementById('cartBox');
  const rows = list.map(it=>{
    const noId = it.id ? "" : ` <a href="https://www.walmart.com/search?q=${encodeURIComponent(it.name)}" target="_blank" rel="noopener" style="color:var(--moderate);font-size:.7rem">search ▸</a>`;
    return `<li><span>${it.name} <span style="color:var(--muted2);font-size:.72rem">${it.label}</span>${noId}</span><span class="q">×${it.packages}</span></li>`;
  }).join("");
  const manual = list.filter(it=>!it.id).map(it=>it.name);
  box.innerHTML = `
    <h3>🛒 Your Walmart cart</h3>
    <div class="cb-sub">${SELECTED.size} meals × ${MEAL_DAYS} days · ${list.length} products</div>
    <ul class="cart-list">${rows}</ul>
    ${manual.length ? `<div class="cart-pantry">⚠️ Add manually (no auto-link): ${manual.join(" · ")}</div>` : ""}
    <div class="cart-pantry">+ Pantry staples you likely have: ${PANTRY.join(" · ")}</div>
    <div id="cartMsg"></div>
    <div class="cart-actions">
      <button class="close" id="cartClose">Edit</button>
      <button class="go" id="cartGo">🛒 Open Walmart Cart</button>
    </div>`;
  document.getElementById('cartModal').classList.add('show');
  document.getElementById('cartClose').addEventListener('click', closeCartModal);
  document.getElementById('cartGo').addEventListener('click', ()=>openWalmartCart(list));
}
function closeCartModal(){ document.getElementById('cartModal').classList.remove('show'); }
document.getElementById('cartModal').addEventListener('click', (e)=>{ if(e.target.id==='cartModal') closeCartModal(); });

function openWalmartCart(list){
  const url = walmartCartURL(list);
  window.open(url, '_blank', 'noopener');
  const msg = document.getElementById('cartMsg');
  if(msg) msg.innerHTML = `<div style="font-size:.76rem;color:var(--muted);line-height:1.5;margin-top:4px">Opened Walmart with your items. Log in, choose <b style="color:var(--accent)">Pickup (free)</b> or Delivery, pick a time, and order. Review quantities before paying.</div>`;
}

// which day is today? JS getDay(): 0=Sun..6=Sat → map to our Mon-first order
const DOW_MAP = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const TODAY = DOW_MAP[new Date().getDay()];

DAYS.forEach((d,i) => {
  const isToday = d.dow === TODAY;
  const card = document.createElement('div');
  card.className = 'day' + (d.rest ? ' full' : '') + (isToday ? ' today' : '');
  card.style.setProperty('--bar', d.color);
  card.innerHTML = `
    <div class="dow">${d.dow}</div>
    <div class="focus">${d.focus}</div>
    <div class="meta"><span class="chip ${chipClass(d.type)}">${d.intensity}</span></div>
    ${d.rest ? '' : '<div class="caret">▼</div>'}`;
  const detail = document.createElement('div');
  detail.className = 'detail';
  detail.innerHTML = `<div class="panel" style="--bar:${d.color}">${detailHTML(d)}</div>`;

  card.addEventListener('click', () => {
    const isOpen = detail.classList.contains('show');
    // close all
    document.querySelectorAll('.detail.show').forEach(e => e.classList.remove('show'));
    document.querySelectorAll('.day.open').forEach(e => e.classList.remove('open'));
    if(!isOpen){
      detail.classList.add('show');
      card.classList.add('open');
      setTimeout(()=>card.scrollIntoView({behavior:'smooth', block:'start'}), 60);
    }
  });

  grid.appendChild(card);
  grid.appendChild(detail);
});

/* week-dots indicator in header (Mon→Sun, today highlighted) */
(function renderWeekDots(){
  const el = document.getElementById('weekDots');
  if(!el) return;
  const order = DAYS.map(d=>d.dow);
  const todayIdx = order.indexOf(TODAY);
  el.innerHTML = order.map((dow,i)=>{
    let cls = 'wd';
    if(i === todayIdx) cls += ' today';
    else if(i < todayIdx) cls += ' done';
    return `<span class="${cls}" title="${dow}"></span>`;
  }).join("");
})();
